site_name: Custom MLOps na Databricks
site_description: Ciclo de vida de modelos com MLflow na Databricks. Um conjunto de dados, dois tipos de modelo, um ciclo de vida governado.
repo_url: https://github.com/allexlima/databricks-mlops-workshop
repo_name: allexlima/databricks-mlops-workshop
edit_uri: ""
copyright: >-
  <span class="md-footer-authors">Authored by
  <a href="https://www.linkedin.com/in/allexlimas/" target="_blank" rel="noopener">Allex Lima</a>,
  <a href="https://www.linkedin.com/in/rampim/" target="_blank" rel="noopener">Lucas Rampim</a>,
  and <a href="https://www.linkedin.com/in/lfbraz/" target="_blank" rel="noopener">Luiz Braz</a>
  &middot; Databricks LATAM SSA Team</span><br>
  <span class="md-footer-made">Made with
  <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a></span><br>
  <span class="md-footer-legal">&copy; 2026 Databricks, Inc. All rights reserved.
  Databricks, the Databricks logo, and Unity Catalog are trademarks of Databricks,
  Inc. Apache, Apache Spark, Spark, and the Spark logo are trademarks of the Apache
  Software Foundation.<br>All other trademarks are the property of their respective
  owners. Educational material; not official Databricks documentation.</span>

theme:
  name: material
  language: pt-BR
  logo: assets/primary-lockup-full-color-white-rgb.svg
  favicon: assets/databricks-favicon-48x48-orange.png
  font:
    text: DM Sans
    code: DM Mono
  features:
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false   # we render our own "Made with" line in the footer copyright

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Início: index.md
  - Conceitos:
      - PyFunc e modelos customizados: conceitos/pyfunc-modelos-customizados.md
      - Otimização com Pyomo: conceitos/otimizacao-pyomo.md
  - Environment Setup:
      - Pré-requisitos: setup/prerequisites.md
  - "Lab 1: Gerar o conjunto de dados": lab-1-generate-data/index.md
  - "Lab 2: Treinar o forecaster (sklearn)": lab-2-forecaster/index.md
  - "Lab 3: Otimizador Pyomo (destaque)":
      - Visão geral: lab-3-optimizer/index.md
      - Empacotar como PyFunc: lab-3-optimizer/modelo-pyfunc.md
      - Registrar e promover a @champion: lab-3-optimizer/registrar-promover.md
  - "Lab 4: Workflow end-to-end":
      - Visão geral: lab-4-end-to-end/index.md
      - Carregar os modelos por @champion: lab-4-end-to-end/carregar-modelos.md
      - Rodar a cadeia e obter a decisão: lab-4-end-to-end/cadeia-decisao.md
  - "Lab 5: Verificação": lab-5-verify/index.md
  - Labs opcionais: optional/index.md
