<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 120" role="img" aria-label="Cadeia ponta a ponta: drivers, forecaster, preco previsto, otimizador, decisao de compra">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FF3621"/>
    </marker>
    <style>
      .data{fill:#e7ebec;stroke:#1B3139;stroke-width:1.5;}
      .model{fill:#1B3139;}
      .dlbl{fill:#1B3139;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;font-weight:600;text-anchor:middle;}
      .mlbl{fill:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;font-weight:600;text-anchor:middle;}
      .flow{stroke:#FF3621;stroke-width:2.5;marker-end:url(#arrow3);}
    </style>
  </defs>
  <rect class="data" x="8"   y="40" width="150" height="46" rx="8"/>
  <text class="dlbl" x="83"  y="62">Drivers</text>
  <text class="dlbl" x="83"  y="78">(mês atual)</text>
  <line class="flow" x1="160" y1="63" x2="194" y2="63"/>

  <rect class="model" x="198" y="40" width="180" height="46" rx="8"/>
  <text class="mlbl" x="288" y="62">Forecaster</text>
  <text class="mlbl" x="288" y="78">@champion</text>
  <line class="flow" x1="380" y1="63" x2="414" y2="63"/>

  <rect class="data" x="418" y="40" width="150" height="46" rx="8"/>
  <text class="dlbl" x="493" y="68">Preço previsto</text>
  <line class="flow" x1="570" y1="63" x2="604" y2="63"/>

  <rect class="model" x="608" y="40" width="180" height="46" rx="8"/>
  <text class="mlbl" x="698" y="62">Otimizador</text>
  <text class="mlbl" x="698" y="78">@champion</text>
  <line class="flow" x1="790" y1="63" x2="824" y2="63"/>

  <rect class="data" x="828" y="40" width="148" height="46" rx="8"/>
  <text class="dlbl" x="902" y="62">Decisão de</text>
  <text class="dlbl" x="902" y="78">compra</text>
</svg>
